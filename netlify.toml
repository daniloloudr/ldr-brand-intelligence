[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[dev]
  command     = "npm run dev"
  targetPort  = 5173
  port        = 8888
  autoLaunch  = false

[build.environment]
  NODE_VERSION = "20"


[functions."cron-monitor"]
  schedule = "0 8 * * 1"

[functions."brand-distill-cron"]
  schedule = "0 7 * * *"

[functions."diagnostico-reaper"]
  schedule = "*/15 * * * *"

[functions."diagnostico-gerar"]
  timeout = 120

[functions."content-hub-gerar"]
  timeout = 120
