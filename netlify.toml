[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[dev]
  command     = "npm run dev"
  targetPort  = 5173
  port        = 8888
  autoLaunch  = false

[build.environment]
  NODE_VERSION = "20"


[functions."cron-monitor"]
  schedule = "0 8 * * 1"

[functions."brand-distill-cron"]
  schedule = "0 7 * * *"

[functions."concorrente-diagnosticar-cron"]
  schedule = "0 6 * * 1"

[functions."concorrente-clipping-cron"]
  schedule = "0 9 * * 1"

[functions."trends-cron"]
  schedule = "0 10 * * 1"

[functions."diagnostico-reaper"]
  schedule = "*/15 * * * *"

[functions."cron-watchdog"]
  schedule = "30 * * * *"

# Setup de marca: avança o pipeline de onboarding sem depender da aba do admin.
# De minuto em minuto porque o processo inteiro leva ~1h e a latência entre
# etapas não importa — o que importa é que ande sozinho.
[functions."onboard-cron"]
  schedule = "* * * * *"

[functions."diagnostico-gerar"]
  timeout = 120

[functions."content-hub-gerar"]
  timeout = 120
